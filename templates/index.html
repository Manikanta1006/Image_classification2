<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cat Dog Classifier</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      :root {
        color: #182033;
        background: #f5f7fb;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(280px, 420px) minmax(0, 1fr);
      }

      .panel {
        background: #ffffff;
        border-right: 1px solid #dfe5ef;
        padding: 32px;
      }

      .workspace {
        padding: 32px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 32px;
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: #596579;
        line-height: 1.5;
      }

      .uploadBox {
        margin-top: 28px;
        border: 1px dashed #9aa8bc;
        border-radius: 8px;
        padding: 20px;
        background: #fbfcff;
      }

      input[type="file"] {
        width: 100%;
      }

      button {
        width: 100%;
        margin-top: 16px;
        border: 0;
        border-radius: 8px;
        background: #1f6feb;
        color: #ffffff;
        font-weight: 700;
        padding: 12px 16px;
        cursor: pointer;
      }

      button:disabled {
        background: #9aa8bc;
        cursor: not-allowed;
      }

      .preview {
        width: 100%;
        max-height: 360px;
        object-fit: contain;
        border-radius: 8px;
        background: #ffffff;
        border: 1px solid #dfe5ef;
      }

      .resultGrid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
        margin-bottom: 20px;
      }

      .metric {
        background: #ffffff;
        border: 1px solid #dfe5ef;
        border-radius: 8px;
        padding: 20px;
      }

      .label {
        display: block;
        color: #596579;
        font-size: 13px;
        margin-bottom: 8px;
      }

      .value {
        font-size: 28px;
        font-weight: 800;
        overflow-wrap: anywhere;
      }

      .fileValue {
        font-size: 18px;
        line-height: 1.35;
      }

      .bars {
        background: #ffffff;
        border: 1px solid #dfe5ef;
        border-radius: 8px;
        padding: 20px;
        margin-top: 20px;
      }

      .barRow {
        margin-top: 14px;
      }

      .barHeader {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-weight: 700;
      }

      .barLabel {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .barMeta {
        color: #596579;
        font-size: 12px;
        font-weight: 600;
      }

      .barTrack {
        height: 12px;
        background: #e8edf5;
        border-radius: 999px;
        overflow: hidden;
        margin-top: 8px;
      }

      .barFill {
        height: 100%;
        background: #20a36b;
      }

      .error {
        margin-top: 16px;
        color: #b42318;
        background: #fff1f0;
        border: 1px solid #ffccc7;
        border-radius: 8px;
        padding: 12px;
      }

      .empty {
        min-height: 320px;
        display: grid;
        place-items: center;
        border: 1px solid #dfe5ef;
        border-radius: 8px;
        background: #ffffff;
        color: #596579;
        text-align: center;
        padding: 24px;
      }

      @media (max-width: 820px) {
        .shell {
          grid-template-columns: 1fr;
        }

        .panel {
          border-right: 0;
          border-bottom: 1px solid #dfe5ef;
        }

        .resultGrid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState } = React;

      function App() {
        const [file, setFile] = useState(null);
        const [previewUrl, setPreviewUrl] = useState("");
        const [result, setResult] = useState(null);
        const [error, setError] = useState("");
        const [loading, setLoading] = useState(false);

        function handleFileChange(event) {
          const selectedFile = event.target.files[0];
          setFile(selectedFile || null);
          setResult(null);
          setError("");

          if (previewUrl) {
            URL.revokeObjectURL(previewUrl);
          }

          if (selectedFile) {
            setPreviewUrl(URL.createObjectURL(selectedFile));
          } else {
            setPreviewUrl("");
          }
        }

        async function handlePredict() {
          if (!file) {
            setError("Please choose an image first.");
            return;
          }

          setLoading(true);
          setError("");
          setResult(null);

          const formData = new FormData();
          formData.append("image", file);

          try {
            const response = await fetch("/predict", {
              method: "POST",
              body: formData,
            });
            const data = await response.json();

            if (!response.ok) {
              throw new Error(data.error || "Prediction failed.");
            }

            setResult(data);
          } catch (err) {
            setError(err.message);
          } finally {
            setLoading(false);
          }
        }

        return (
          <main className="shell">
            <section className="panel">
              <h1>Image Classifier</h1>
              <p>Upload one image and the trained model will show the uploaded file name, predicted label, and confidence.</p>

              <div className="uploadBox">
                <input type="file" accept="image/*" onChange={handleFileChange} />
                <button onClick={handlePredict} disabled={loading}>
                  {loading ? "Checking image..." : "Predict"}
                </button>
              </div>

              {error && <div className="error">{error}</div>}
            </section>

            <section className="workspace">
              {previewUrl ? (
                <img className="preview" src={previewUrl} alt="Uploaded preview" />
              ) : (
                <div className="empty">Choose an image to start.</div>
              )}

              {result && (
                <div className="bars">
                  <div className="resultGrid">
                    <div className="metric">
                      <span className="label">Uploaded Image</span>
                      <span className="value fileValue">{result.uploadedFilename}</span>
                    </div>
                    <div className="metric">
                      <span className="label">Label ID</span>
                      <span className="value">{result.predictedLabel.id}</span>
                    </div>
                    <div className="metric">
                      <span className="label">Predicted Label</span>
                      <span className="value">{result.predictedLabel.displayName}</span>
                    </div>
                    <div className="metric">
                      <span className="label">Accurate Value</span>
                      <span className="value">{result.confidencePercent}%</span>
                    </div>
                  </div>

                  {result.probabilities.map((item) => (
                    <div className="barRow" key={item.labelId}>
                      <div className="barHeader">
                        <span className="barLabel">
                          <span>{item.displayName}</span>
                          <span className="barMeta">Label {item.labelId}: {item.className}</span>
                        </span>
                        <span>{item.percent}%</span>
                      </div>
                      <div className="barTrack">
                        <div className="barFill" style={{ width: `${item.percent}%` }}></div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </section>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
