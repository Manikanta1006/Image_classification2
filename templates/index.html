<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cat Dog Classifier</title>
    <style>
      :root {
        color: #182033;
        background: #f5f7fb;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(280px, 420px) minmax(0, 1fr);
      }

      .panel {
        background: #ffffff;
        border-right: 1px solid #dfe5ef;
        padding: 32px;
      }

      .workspace {
        padding: 32px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 32px;
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: #596579;
        line-height: 1.5;
      }

      .uploadBox {
        margin-top: 28px;
        border: 1px dashed #9aa8bc;
        border-radius: 8px;
        padding: 20px;
        background: #fbfcff;
      }

      input[type="file"] {
        width: 100%;
      }

      button {
        width: 100%;
        margin-top: 16px;
        border: 0;
        border-radius: 8px;
        background: #1f6feb;
        color: #ffffff;
        font-weight: 700;
        padding: 12px 16px;
        cursor: pointer;
      }

      .secondaryButton {
        background: #117864;
      }

      button:disabled {
        background: #9aa8bc;
        cursor: not-allowed;
      }

      .preview {
        width: 100%;
        max-height: 360px;
        object-fit: contain;
        border-radius: 8px;
        background: #ffffff;
        border: 1px solid #dfe5ef;
      }

      .annotatedPreview {
        max-height: none;
        margin-bottom: 20px;
      }

      .resultGrid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
        margin-bottom: 20px;
      }

      .metric {
        background: #ffffff;
        border: 1px solid #dfe5ef;
        border-radius: 8px;
        padding: 20px;
      }

      .label {
        display: block;
        color: #596579;
        font-size: 13px;
        margin-bottom: 8px;
      }

      .value {
        font-size: 28px;
        font-weight: 800;
        overflow-wrap: anywhere;
      }

      .fileValue {
        font-size: 18px;
        line-height: 1.35;
      }

      .bars {
        background: #ffffff;
        border: 1px solid #dfe5ef;
        border-radius: 8px;
        padding: 20px;
        margin-top: 20px;
      }

      .sectionTitle {
        margin: 0 0 14px;
        font-size: 18px;
      }

      .barRow {
        margin-top: 14px;
      }

      .barHeader {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-weight: 700;
      }

      .barLabel {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .barMeta {
        color: #596579;
        font-size: 12px;
        font-weight: 600;
      }

      .detectionList {
        display: grid;
        gap: 10px;
      }

      .detectionItem {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        border: 1px solid #dfe5ef;
        border-radius: 8px;
        padding: 12px;
        background: #fbfcff;
      }

      .barTrack {
        height: 12px;
        background: #e8edf5;
        border-radius: 999px;
        overflow: hidden;
        margin-top: 8px;
      }

      .barFill {
        height: 100%;
        background: #20a36b;
      }

      .error {
        margin-top: 16px;
        color: #b42318;
        background: #fff1f0;
        border: 1px solid #ffccc7;
        border-radius: 8px;
        padding: 12px;
      }

      .empty {
        min-height: 320px;
        display: grid;
        place-items: center;
        border: 1px solid #dfe5ef;
        border-radius: 8px;
        background: #ffffff;
        color: #596579;
        text-align: center;
        padding: 24px;
      }

      .hidden {
        display: none;
      }

      @media (max-width: 820px) {
        .shell {
          grid-template-columns: 1fr;
        }

        .panel {
          border-right: 0;
          border-bottom: 1px solid #dfe5ef;
        }

        .resultGrid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <h1>Image Classifier</h1>
        <p>Upload one image and the trained model will show the uploaded file name, predicted label, and confidence.</p>

        <div class="uploadBox">
          <input id="imageInput" type="file" accept="image/*" />
          <button id="predictButton" type="button">Predict Label</button>
          <button id="detectButton" class="secondaryButton" type="button">Detect Objects</button>
        </div>

        <div id="errorBox" class="error hidden"></div>
      </section>

      <section class="workspace">
        <div id="emptyState" class="empty">Choose an image to start.</div>
        <img id="previewImage" class="preview hidden" alt="Uploaded preview" />
        <div id="output"></div>
      </section>
    </main>

    <script>
      const imageInput = document.getElementById("imageInput");
      const predictButton = document.getElementById("predictButton");
      const detectButton = document.getElementById("detectButton");
      const errorBox = document.getElementById("errorBox");
      const emptyState = document.getElementById("emptyState");
      const previewImage = document.getElementById("previewImage");
      const output = document.getElementById("output");

      let selectedFile = null;
      let previewUrl = "";

      function showError(message) {
        errorBox.textContent = message;
        errorBox.classList.remove("hidden");
      }

      function clearError() {
        errorBox.textContent = "";
        errorBox.classList.add("hidden");
      }

      function resetOutput() {
        output.innerHTML = "";
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          "\"": "&quot;",
          "'": "&#039;",
        })[char]);
      }

      function requireFile() {
        if (!selectedFile) {
          showError("Please choose an image first.");
          return false;
        }
        return true;
      }

      function makeFormData() {
        const formData = new FormData();
        formData.append("image", selectedFile);
        return formData;
      }

      async function postImage(endpoint) {
        const response = await fetch(endpoint, {
          method: "POST",
          body: makeFormData(),
        });
        const contentType = response.headers.get("content-type") || "";
        const data = contentType.includes("application/json")
          ? await response.json()
          : { error: await response.text() };

        if (!response.ok) {
          throw new Error(data.error || "Request failed.");
        }

        return data;
      }

      function renderPrediction(result) {
        const metrics = [
          ["Uploaded Image", result.uploadedFilename, "fileValue"],
          ["Label ID", result.predictedLabel.id, ""],
          ["Predicted Label", result.predictedLabel.displayName, ""],
          ["Accurate Value", `${result.confidencePercent}%`, ""],
        ].map(([label, value, valueClass]) => `
          <div class="metric">
            <span class="label">${escapeHtml(label)}</span>
            <span class="value ${valueClass}">${escapeHtml(value)}</span>
          </div>
        `).join("");

        const bars = result.probabilities.map((item) => `
          <div class="barRow">
            <div class="barHeader">
              <span class="barLabel">
                <span>${escapeHtml(item.displayName)}</span>
                <span class="barMeta">Label ${escapeHtml(item.labelId)}: ${escapeHtml(item.className)}</span>
              </span>
              <span>${escapeHtml(item.percent)}%</span>
            </div>
            <div class="barTrack">
              <div class="barFill" style="width: ${Math.max(0, Math.min(100, Number(item.percent)))}%"></div>
            </div>
          </div>
        `).join("");

        output.innerHTML = `
          <div class="bars">
            <div class="resultGrid">${metrics}</div>
            ${bars}
          </div>
        `;
      }

      function renderDetection(result) {
        const detections = result.detections.length
          ? result.detections.map((item, index) => `
              <div class="detectionItem">
                <span>
                  <strong>${escapeHtml(item.label)}</strong>
                  <span class="barMeta"> Label ${escapeHtml(item.labelId)}</span>
                </span>
                <span>${escapeHtml(item.confidencePercent)}%</span>
              </div>
            `).join("")
          : "<p>No objects found with the current confidence threshold.</p>";

        output.innerHTML = `
          <div class="bars">
            <h2 class="sectionTitle">Detected Objects</h2>
            <img class="preview annotatedPreview" src="${result.annotatedImage}" alt="Detected objects" />
            <div class="resultGrid">
              <div class="metric">
                <span class="label">Uploaded Image</span>
                <span class="value fileValue">${escapeHtml(result.uploadedFilename)}</span>
              </div>
              <div class="metric">
                <span class="label">Model</span>
                <span class="value fileValue">${escapeHtml(result.model)}</span>
              </div>
              <div class="metric">
                <span class="label">Objects Found</span>
                <span class="value">${escapeHtml(result.detectionCount)}</span>
              </div>
            </div>
            <div class="detectionList">${detections}</div>
          </div>
        `;
      }

      imageInput.addEventListener("change", () => {
        selectedFile = imageInput.files[0] || null;
        clearError();
        resetOutput();

        if (previewUrl) {
          URL.revokeObjectURL(previewUrl);
        }

        if (selectedFile) {
          previewUrl = URL.createObjectURL(selectedFile);
          previewImage.src = previewUrl;
          previewImage.classList.remove("hidden");
          emptyState.classList.add("hidden");
        } else {
          previewUrl = "";
          previewImage.removeAttribute("src");
          previewImage.classList.add("hidden");
          emptyState.classList.remove("hidden");
        }
      });

      predictButton.addEventListener("click", async () => {
        if (!requireFile()) {
          return;
        }

        clearError();
        resetOutput();
        predictButton.disabled = true;
        predictButton.textContent = "Checking image...";

        try {
          renderPrediction(await postImage("/predict"));
        } catch (error) {
          showError(error.message);
        } finally {
          predictButton.disabled = false;
          predictButton.textContent = "Predict Label";
        }
      });

      detectButton.addEventListener("click", async () => {
        if (!requireFile()) {
          return;
        }

        clearError();
        resetOutput();
        detectButton.disabled = true;
        detectButton.textContent = "Finding objects...";

        try {
          renderDetection(await postImage("/detect"));
        } catch (error) {
          showError(error.message);
        } finally {
          detectButton.disabled = false;
          detectButton.textContent = "Detect Objects";
        }
      });
    </script>
  </body>
</html>
